# cspell:words ncipollo

name: publish
on:
  push:
    branches: ['**']
  delete:
env:
  NODE_VERSION: 24

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'

    - name: Install project
      run: yarn

    - name: Build contracts
      run: yarn compile

    - name: Determine version
      run: |
        export BRANCH=${GITHUB_REF##*/}
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "Branch $BRANCH"
        export VERSION=$(bash ./scripts/calculate_version.sh)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version $VERSION"
        ( test $BRANCH = "stable" && export PRERELEASE=false ) || export PRERELEASE=true
        echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

    - name: Publish NPM package
      run: ./scripts/publish_package.sh
      env:
        BRANCH: ${{ env.BRANCH }}

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.VERSION }}
        commit: ${{ github.sha }}
        prerelease: ${{ env.PRERELEASE }}

  clean:
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Remove feature tag
      env:
        DELETED_BRANCH: ${{ github.event.ref }}
      run: |
        export TAG=$(echo ${DELETED_BRANCH##*/} | tr [:upper:] [:lower:] | tr -d [:space:])
        echo "Tag: $TAG"
        if [ -z "$(npm view @skalenetwork/fair-manager-interfaces dist-tags.$TAG)" ]
        then
            echo "Tag $TAG was not published, nothing to remove"
            exit 0
        fi
        npm install -g npm@latest
        npm dist-tag rm @skalenetwork/fair-manager-interfaces $TAG
